<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Rich dark tech gradient for base background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060a" />
      <stop offset="50%" stop-color="#09101f" />
      <stop offset="100%" stop-color="#030509" />
    </linearGradient>

    <!-- Subtle border highlight -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.5" />
    </linearGradient>

    <!-- Cyan-blue-indigo electric infinity stroke -->
    <linearGradient id="infinityGrad" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Ambient center glow -->
    <radialGradient id="radialGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#04060a" stop-opacity="0" />
    </radialGradient>

    <!-- Center node radial glow -->
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </radialGradient>
  </defs>

  <!-- Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="112" ry="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="16" />

  <!-- Ambient background glow behind infinity mark -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="url(#radialGlow)" />

  <!-- Infinity Outer Glow Stroke (underneath main stroke for crisp bloom) -->
  <g transform="translate(64, 64) scale(16)">
    <path
      d="M12 12c-2-2.67-4-4-6.5-4a4.5 4.5 0 1 0 0 9c2.5 0 4.5-1.33 6.5-4z"
      fill="none"
      stroke="#00f2fe"
      stroke-opacity="0.25"
      stroke-width="4.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M12 12c2 2.67 4 4 6.5 4a4.5 4.5 0 1 0 0-9c-2.5 0-4.5 1.33-6.5 4z"
      fill="none"
      stroke="#6366f1"
      stroke-opacity="0.25"
      stroke-width="4.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Main Crisp Infinity Stroke -->
  <g transform="translate(64, 64) scale(16)">
    <path
      d="M12 12c-2-2.67-4-4-6.5-4a4.5 4.5 0 1 0 0 9c2.5 0 4.5-1.33 6.5-4z"
      fill="none"
      stroke="url(#infinityGrad)"
      stroke-width="2.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M12 12c2 2.67 4 4 6.5 4a4.5 4.5 0 1 0 0-9c-2.5 0-4.5 1.33-6.5 4z"
      fill="none"
      stroke="url(#infinityGrad)"
      stroke-width="2.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Outer halo around center circuit node -->
    <circle cx="12" cy="12" r="3.2" fill="#00f2fe" fill-opacity="0.3" />

    <!-- Center circuit node core -->
    <circle cx="12" cy="12" r="1.9" fill="url(#nodeGlow)" />
  </g>
</svg>
